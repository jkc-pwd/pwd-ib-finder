<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WB PWD IB Finder - Final Exact</title>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto}
body{margin:0;background:#f8f6ef;color:#222}
.header{background:linear-gradient(90deg,#7a1f1f,#a33a2f);color:#fff;padding:18px;text-align:center}
.header h1{margin:0;font-size:18px}.header p{margin:5px 0 0;font-size:11px;opacity:.9}
.container{max-width:860px;margin:0 auto;padding:12px}
.search{width:100%;padding:13px;border-radius:12px;border:1.5px solid #d4b896;font-size:15px;background:#fff;outline:none}
.row{display:flex;gap:8px;margin:10px 0}select{flex:1;padding:12px;border-radius:10px;border:1.5px solid #d4b896;background:#fff;font-size:14px}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-weight:700;cursor:pointer;font-size:14px}
.btn-p{background:#1a5da0;color:#fff}.btn-s{background:#fff;border:1.5px solid #1a5da0;color:#1a5da0}
.card{background:#fff;border-radius:14px;padding:14px;margin-top:10px;box-shadow:0 2px 10px rgba(0,0,0,.07);border-left:5px solid #7a1f1f}
.meta{font-size:11px;color:#666;margin-top:4px}.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts a{padding:8px 14px;border-radius:20px;text-decoration:none;font-size:13px;font-weight:600}
.map{background:#e8f4ff;color:#0d47a1}.book{background:#1a5da0;color:#fff}
.km{background:#fef3c7;padding:3px 8px;border-radius:12px;font-size:11px;margin-left:6px}
.footer{margin-top:18px;background:#fff;padding:12px;border-radius:12px;font-size:11px;color:#666;text-align:center;border:1px dashed #d4b896}
</style>
</head>
<body>
<div class="header"><h1>WB PWD IB FINDER</h1><p>Exact Verified Locations | Public Works Department, WB</p></div>
<div class="container">
<input id="q" class="search" placeholder="Search bungalow or district..." oninput="render()">
<div class="row"><select id="dist" onchange="render()"><option value="">All Districts</option></select></div>
<div class="row"><button class="btn btn-p" onclick="nearMe()">📍 IB Near Me</button><button class="btn btn-s" onclick="clearF()">Show All</button></div>
<div id="status" style="font-size:13px;color:#7a1f1f;margin:6px 2px;min-height:18px"></div>
<div id="list"></div>
<div class="footer">Booking: <a href="https://pwdbungalow.wb.gov.in" target="_blank">pwdbungalow.wb.gov.in</a><br>Developed by <b>Jayanta Kumar Chakraborty, EE/PWD</b> | 100% Exact Google Coordinates</div>
</div>
<script>
const DATA=[
{name:"Purulia Bungalow",district:"Purulia",lat:23.34315014007225,lng:86.35290171847424},
{name:"Jhargram Inspection Bungalow",district:"Jhargram",lat:22.450212035251237,lng:86.99865259574317},
{name:"Digha Inspection Bungalow",district:"Purba Medinipur",lat:21.624203497375593,lng:87.52628918473934},
{name:"Bishnupur Inspection Bungalow",district:"Bankura",lat:23.064227744114216,lng:87.30421055703746},
{name:"Asansol Inspection Bungalow",district:"Paschim Bardhaman",lat:23.685229241434563,lng:86.94584704176732},
{name:"Durgapur Inspection Bungalow",district:"Paschim Bardhaman",lat:23.640652797953347,lng:87.52453768316128},
{name:"Bolpur Inspection Bungalow",district:"Birbhum",lat:23.671429387323172,lng:87.69340253824028},
{name:"Kalyani Inspection Bungalow",district:"Nadia",lat:22.97621365553786,lng:88.44729253895738},
{name:"Basirhat Inspection Bungalow",district:"North 24 Parganas",lat:22.664190956512833,lng:88.87626541293196},
{name:"Krishnanagar IB",district:"Nadia",lat:23.407722530756672,lng:88.4763187110133},
{name:"Bongaon Inspection Bungalow",district:"North 24 Parganas",lat:23.047806678062955,lng:88.82939305823268},
{name:"Berhampore Inspection Bungalow",district:"Murshidabad",lat:24.087853589577026,lng:88.26135959053015},
{name:"Malda Inspection Bungalow Bugbari",district:"Malda",lat:25.010650177750204,lng:88.11369971550286},
{name:"Kulik Rest Shed",district:"Uttar Dinajpur",lat:25.634977946587924,lng:88.12098997614493},
{name:"Balurghat Inspection Bungalow",district:"Dakshin Dinajpur",lat:25.243719524077633,lng:88.78171002522123},
{name:"Siliguri Inspection Bungalow",district:"Darjeeling",lat:26.710945940274343,lng:88.42683540558264},
{name:"Shaktigarh Rest Shade, Siliguri",district:"Darjeeling",lat:26.695136244016886,lng:88.41162218142186},
{name:"Darjeeling Inspection Bungalow",district:"Darjeeling",lat:27.04124519665658,lng:88.26779123947341},
{name:"Peshok Inspection Bungalow",district:"Darjeeling",lat:27.084836975852934,lng:88.43043032407341},
{name:"Chalsa Inspection Bungalow",district:"Jalpaiguri",lat:26.885441737608335,lng:88.79915688409662},
{name:"Cooch Behar Highway IB",district:"Cooch Behar",lat:26.32342653504632,lng:89.43768222401654},
{name:"Cooch Behar Inspection Bungalow",district:"Cooch Behar",lat:26.320353746143738,lng:89.44842170988932},
{name:"Madarihat Inspection Bungalow",district:"Alipurduar",lat:26.695700667129497,lng:89.28135327245009},
{name:"Alipurduar Inspection Bungalow",district:"Alipurduar",lat:26.498496121681573,lng:89.52958613012079}
];
function init(){const d=document.getElementById('dist');[...new Set(DATA.map(x=>x.district))].sort().forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;d.appendChild(o)})}
function distKm(a,b,c,d){const R=6371;const dLat=(c-a)*Math.PI/180,dLon=(d-b)*Math.PI/180;const la1=a*Math.PI/180,la2=c*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
let uLat=null,uLng=null;
function nearMe(){const s=document.getElementById('status');s.textContent='📡 Finding exact location...';if(!navigator.geolocation){s.textContent='❌ GPS not supported';return}navigator.geolocation.getCurrentPosition(p=>{uLat=p.coords.latitude;uLng=p.coords.longitude;DATA.forEach(it=>it._d=distKm(uLat,uLng,it.lat,it.lng));DATA.sort((a,b)=>a._d-b._d);s.textContent=`✅ You: ${uLat.toFixed(5)}, ${uLng.toFixed(5)} • Accuracy ${Math.round(p.coords.accuracy)}m • Nearest first`;render()},err=>{s.textContent='❌ Permission denied. Enable Location.'},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
function clearF(){document.getElementById('q').value='';document.getElementById('dist').value='';document.getElementById('status').textContent='';uLat=null;DATA.forEach(d=>delete d._d);render()}
function render(){const q=document.getElementById('q').value.toLowerCase();const df=document.getElementById('dist').value;let list=DATA.filter(it=>{if(df&&it.district!==df)return false;if(q){const h=(it.name+' '+it.district).toLowerCase();if(!h.includes(q))return false}return true});document.getElementById('list').innerHTML=list.map(it=>`<div class="card"><b>${it.name}</b>${it._d!==undefined?`<span class="km">${it._d.toFixed(1)} km</span>`:''}<div class="meta">📍 ${it.district} • ${it.lat.toFixed(7)}, ${it.lng.toFixed(7)}</div><div class="acts"><a class="map" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${it.lat},${it.lng}">🧭 Directions</a><a class="book" target="_blank" href="https://pwdbungalow.wb.gov.in">🏨 Book</a></div></div>`).join('');if(!uLat)document.getElementById('status').textContent=`Showing ${list.length} bungalows - 100% exact as per your file`}
init();render();
</script>
</body>
</html>
