<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WB PWD IB Finder | Jayanta Kumar Chakraborty EE/PWD</title>
<style>
*{box-sizing:border-box;font-family:system-ui,Segoe UI,Roboto}
body{margin:0;background:#f8f6ef}
.header{background:#7a1f1f;color:#fff;padding:16px;text-align:center}
.header h1{margin:0;font-size:18px}
.container{max-width:860px;margin:0 auto;padding:12px}
.search{width:100%;padding:13px;border-radius:12px;border:1.5px solid #d4b896;font-size:15px}
.row{display:flex;gap:8px;margin:10px 0}
select{flex:1;padding:12px;border-radius:10px;border:1.5px solid #d4b896}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-weight:700;cursor:pointer}
.btn-p{background:#1a5da0;color:#fff}.btn-s{background:#fff;border:1.5px solid #1a5da0;color:#1a5da0}
.card{background:#fff;border-radius:14px;padding:14px;margin-top:10px;box-shadow:0 2px 8px rgba(0,0,0,.07);border-left:5px solid #7a1f1f}
.meta{font-size:12px;color:#666;margin-top:4px}
.acts{display:flex;gap:8px;margin-top:10px}
.acts a{padding:8px 12px;border-radius:20px;text-decoration:none;font-size:13px;font-weight:600}
.map{background:#e8f4ff;color:#0d47a1}.book{background:#1a5da0;color:#fff}
.km{background:#fef3c7;padding:3px 8px;border-radius:12px;font-size:11px;margin-left:6px}
.footer{margin-top:16px;background:#fff;padding:10px;border-radius:10px;font-size:11px;text-align:center;color:#666}
</style>
</head>
<body>
<div class="header"><h1>WB PWD IB FINDER</h1><p style="margin:4px 0 0;font-size:11px">Inspection Bungalow Locator | PWD, West Bengal</p></div>
<div class="container">
<input id="q" class="search" placeholder="Search by name or district..." oninput="render()">
<div class="row"><select id="dist" onchange="render()"><option value="">All Districts</option></select></div>
<div class="row"><button class="btn btn-p" onclick="nearMe()">📍 IB Near Me</button><button class="btn btn-s" onclick="clearF()">Show All</button></div>
<div id="status" style="font-size:13px;color:#7a1f1f;margin:6px 2px"></div>
<div id="list"></div>
<div class="footer">Booking: pwdbungalow.wb.gov.in<br>Conceptualized & Developed by <b>Jayanta Kumar Chakraborty, EE/PWD</b></div>
</div>
<script>
const DATA=[
{name:"Alipurduar IB",district:"Alipurduar",lat:26.4888,lng:89.5269},
{name:"Asansol IB",district:"Paschim Bardhaman",lat:23.6837,lng:86.9524},
{name:"Balurghat IB",district:"Dakshin Dinajpur",lat:25.2287,lng:88.7759},
{name:"Basirhat IB",district:"North 24 Parganas",lat:22.66,lng:88.8944},
{name:"Berhampore IB",district:"Murshidabad",lat:24.0986,lng:88.2683},
{name:"Bishnupur IB",district:"Bankura",lat:23.0763,lng:87.3167},
{name:"Bolpur IB",district:"Birbhum",lat:23.6696,lng:87.6778},
{name:"Bongaon IB",district:"North 24 Parganas",lat:23.0426,lng:88.8178},
{name:"Chalsa IB",district:"Jalpaiguri",lat:26.8811,lng:88.7853},
{name:"Cooch Behar Highway IB",district:"Cooch Behar",lat:26.3255,lng:89.4439},
{name:"Cooch Behar IB",district:"Cooch Behar",lat:26.3245,lng:89.4486},
{name:"Darjeeling IB",district:"Darjeeling",lat:27.0413,lng:88.2685},
{name:"Digha IB",district:"Purba Medinipur",lat:21.6277,lng:87.5044},
{name:"Durgapur IB",district:"Paschim Bardhaman",lat:23.5487,lng:87.2932},
{name:"Jhargram IB",district:"Jhargram",lat:22.4547,lng:86.9965},
{name:"Kalyani IB",district:"Nadia",lat:22.9758,lng:88.4347},
{name:"Krishnanagar IB",district:"Nadia",lat:23.4076,lng:88.492},
{name:"Kulik IB",district:"Uttar Dinajpur",lat:25.6249,lng:88.1227},
{name:"Madarihat IB",district:"Alipurduar",lat:26.6972,lng:89.2685},
{name:"Malda IB Bugbari",district:"Malda",lat:25.0072,lng:88.1459},
{name:"Peshok IB",district:"Darjeeling",lat:27.0692,lng:88.3883},
{name:"Purulia Bungalow",district:"Purulia",lat:23.3314,lng:86.3653},
{name:"Shaktigarh Rest Shade",district:"Darjeeling",lat:26.7462,lng:88.4181},
{name:"Siliguri IB",district:"Darjeeling",lat:26.7271,lng:88.3953}
];
function init(){const d=document.getElementById('dist');[...new Set(DATA.map(x=>x.district))].sort().forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;d.appendChild(o)});}
function distKm(a,b,c,d){const R=6371;const dLat=(c-a)*Math.PI/180,dLon=(d-b)*Math.PI/180;const la1=a*Math.PI/180,la2=c*Math.PI/180;const x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
let uLat=null,uLng=null;
function nearMe(){
 const s=document.getElementById('status');s.textContent='📡 Finding your exact location... please allow GPS permission';
 if(!navigator.geolocation){s.textContent='❌ GPS not supported on this device';return;}
 navigator.geolocation.getCurrentPosition(p=>{
  uLat=p.coords.latitude;uLng=p.coords.longitude;
  DATA.forEach(it=>it._d=distKm(uLat,uLng,it.lat,it.lng));
  DATA.sort((a,b)=>a._d-b._d);
  s.textContent=`✅ Your location: ${uLat.toFixed(4)}, ${uLng.toFixed(4)} • Showing nearest IB first (accurate within ${Math.round(p.coords.accuracy)}m)`;
  render(true);
 },err=>{
  let msg='';if(err.code==1)msg='❌ Location permission denied. Please enable Location in browser settings.';else if(err.code==2)msg='❌ Location unavailable. Turn on GPS.';else msg='❌ Timeout. Try again outside building.';
  document.getElementById('status').textContent=msg;
 },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
function clearF(){document.getElementById('q').value='';document.getElementById('dist').value='';document.getElementById('status').textContent='';uLat=null;DATA.forEach(d=>delete d._d);render();}
function render(isNear=false){
 const q=document.getElementById('q').value.toLowerCase();const df=document.getElementById('dist').value;
 let list=DATA.filter(it=>{if(df&&it.district!==df)return false;if(q){const h=(it.name+' '+it.district).toLowerCase();if(!h.includes(q))return false;}return true;});
 document.getElementById('list').innerHTML=list.map(it=>`<div class="card"><b>${it.name}</b>${it._d!==undefined?`<span class="km">${it._d.toFixed(1)} km away</span>`:''}<div class="meta">📍 District: ${it.district} • Lat: ${it.lat} , Lng: ${it.lng}</div><div class="acts"><a class="map" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${it.lat},${it.lng}">🧭 Directions</a><a class="book" target="_blank" href="https://pwdbungalow.wb.gov.in">🏨 Book</a></div></div>`).join('');
}
init();render();
</script>
</body>
</html>
